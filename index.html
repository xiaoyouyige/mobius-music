<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Möbius Music">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Möbius Music · 莫比乌斯音乐</title>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="headings">
        <div class="kicker">MÖBIUS MUSIC</div>
        <h1>音乐库</h1>
        <p id="libMeta">还没有音乐</p>
      </div>
      <div class="headActions">
        <button class="iconBtn" id="btnSearch" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        </button>
        <button class="iconBtn accent" id="btnAdd" aria-label="导入音乐">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <div class="searchBar" id="searchBar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      <input id="searchInput" type="search" placeholder="搜索歌曲、歌手或专辑" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="clearBtn" id="btnClearSearch" aria-label="清空">×</button>
    </div>

    <div class="toolbar" id="toolbar">
      <div class="chips" id="sortChips">
        <button class="chip active" data-sort="added">最近添加</button>
        <button class="chip" data-sort="title">标题</button>
        <button class="chip" data-sort="artist">歌手</button>
      </div>
      <button class="chip action" id="btnPlayAll">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.8c0-.8.9-1.3 1.6-.9l8.3 5.9c.6.4.6 1.3 0 1.7l-8.3 5.9c-.7.4-1.6-.1-1.6-.9V5.8z"/></svg>
        播放全部
      </button>
    </div>

    <main class="library" id="library">
      <section class="empty" id="empty">
        <div class="emptyArt" aria-hidden="true">
          <svg viewBox="0 0 160 160" fill="none">
            <defs>
              <linearGradient id="eg" x1="20" y1="20" x2="140" y2="140" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7DE8FF"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/>
              </linearGradient>
            </defs>
            <circle cx="80" cy="80" r="54" stroke="url(#eg)" stroke-width="1.2" opacity=".35"/>
            <circle cx="80" cy="80" r="38" stroke="url(#eg)" stroke-width="1.2" opacity=".22"/>
            <path d="M80 80c-10-14-27-17-33-9-6 8 1 21 15 21 14 0 21-12 33-12 14 0 20 13 14 21-6 8-23 5-29-9" stroke="url(#eg)" stroke-width="3.2" stroke-linecap="round"/>
            <circle cx="80" cy="80" r="3" fill="url(#eg)"/>
          </svg>
        </div>
        <h2>还没有音乐</h2>
        <p>把 MP3 / M4A / FLAC 等文件放进 iPhone<br>「文件」App 里的音乐文件夹，然后导入。</p>
        <button class="cta" id="btnEmptyImport">导入音乐</button>
        <p class="hint">导入后会保存到本机，断网、锁屏都能继续播放。</p>
      </section>
      <div class="list" id="list"></div>
    </main>
  </div>

  <div class="mini hidden" id="mini">
    <div class="miniCover" id="miniCover"></div>
    <div class="miniText">
      <div class="miniTitle" id="miniTitle">未在播放</div>
      <div class="miniArtist" id="miniArtist">—</div>
    </div>
    <button class="miniBtn" id="miniPlay" aria-label="播放/暂停">
      <svg class="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.8c0-.8.9-1.3 1.6-.9l8.3 5.9c.6.4.6 1.3 0 1.7l-8.3 5.9c-.7.4-1.6-.1-1.6-.9V5.8z"/></svg>
      <svg class="icoPause" viewBox="0 0 24 24" fill="currentColor"><rect x="6.6" y="5" width="3.6" height="14" rx="1.4"/><rect x="13.8" y="5" width="3.6" height="14" rx="1.4"/></svg>
    </button>
    <button class="miniBtn" id="miniNext" aria-label="下一首">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5.8c0-.8.9-1.3 1.6-.9l7.3 5.9c.6.4.6 1.3 0 1.7l-7.3 5.9c-.7.4-1.6-.1-1.6-.9V5.8z"/><rect x="16.4" y="5" width="2.2" height="14" rx="1.1"/></svg>
    </button>
    <div class="miniProgress" id="miniProgress"><i></i></div>
  </div>

  <section class="player" id="player" aria-hidden="true">
    <div class="playerBg" id="playerBg"></div>
    <div class="playerScrim"></div>
    <div class="playerBody">
      <div class="playerTop">
        <button class="roundGhost" id="btnClosePlayer" aria-label="收起">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="playerLabel" id="playerLabel">正在播放</div>
        <button class="roundGhost" id="btnTrackMenu" aria-label="更多">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg>
        </button>
      </div>

      <div class="coverStage">
        <div class="coverShadow"></div>
        <div class="cover" id="coverBox">
          <img id="coverImg" alt="" draggable="false">
          <div class="coverFallback" id="coverFallback"><span>♪</span></div>
        </div>
      </div>

      <div class="nowMeta">
        <h2 id="nowTitle">未在播放</h2>
        <p id="nowArtist">从音乐库选择一首歌</p>
      </div>

      <div class="seekWrap">
        <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="播放进度">
        <div class="seekTimes"><span id="timeCur">0:00</span><span id="timeDur">0:00</span></div>
      </div>

      <div class="controls">
        <button class="ctrl" id="btnShuffle" aria-label="随机播放">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3.2c1.2 0 2.3.5 3.1 1.4L16 15.6c.8.9 1.9 1.4 3.1 1.4H20"/><path d="M17 5l3 3-3 3"/><path d="M4 17h3.2c1.2 0 2.3-.5 3.1-1.4l.9-1"/><path d="M14 9.4l.9-1C15.7 7.5 16.8 7 18 7h2"/><path d="M17 19l3-3-3-3"/></svg>
        </button>
        <button class="ctrl big" id="btnPrev" aria-label="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="2.2" height="14" rx="1.1"/><path d="M18 5.8c0-.8-.9-1.3-1.6-.9l-7.3 5.9c-.6.4-.6 1.3 0 1.7l7.3 5.9c.7.4 1.6-.1 1.6-.9V5.8z"/></svg>
        </button>
        <button class="playMain" id="btnPlay" aria-label="播放/暂停">
          <svg class="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 5.6c0-.9 1-1.5 1.8-1l9 6.4c.7.5.7 1.5 0 2l-9 6.4c-.8.5-1.8-.1-1.8-1V5.6z"/></svg>
          <svg class="icoPause" viewBox="0 0 24 24" fill="currentColor"><rect x="6.6" y="5" width="4" height="14" rx="1.6"/><rect x="13.4" y="5" width="4" height="14" rx="1.6"/></svg>
        </button>
        <button class="ctrl big" id="btnNext" aria-label="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5.8c0-.8.9-1.3 1.6-.9l7.3 5.9c.6.4.6 1.3 0 1.7l-7.3 5.9c-.7.4-1.6-.1-1.6-.9V5.8z"/><rect x="16.4" y="5" width="2.2" height="14" rx="1.1"/></svg>
        </button>
        <button class="ctrl" id="btnRepeat" aria-label="循环模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 4l3 3-3 3"/><path d="M4 11V9.5A2.5 2.5 0 0 1 6.5 7H20"/><path d="M7 20l-3-3 3-3"/><path d="M20 13v1.5a2.5 2.5 0 0 1-2.5 2.5H4"/></svg>
          <span class="badge" id="repeatOne">1</span>
        </button>
      </div>

      <div class="playerFoot">
        <button class="footBtn" id="btnQueue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h11M4 12h11M4 17h7"/><circle cx="18" cy="15" r="2"/><path d="M20 15V7l-2 .8"/></svg>
          播放队列
        </button>
        <button class="footBtn" id="btnImportPlayer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 16v3h14v-3"/></svg>
          导入音乐
        </button>
      </div>
    </div>
  </section>

  <div class="sheetWrap" id="sheetWrap">
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast"><span id="toastText"></span></div>

  <div class="importOverlay" id="importOverlay">
    <div class="importCard">
      <div class="spinner"><span></span><span></span><span></span></div>
      <div class="importTitle">正在导入音乐</div>
      <div class="importSub" id="importSub">准备中…</div>
      <div class="importBar"><i id="importBar"></i></div>
      <button class="importCancel" id="btnCancelImport">取消导入</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.aiff,.aif" multiple hidden>
  <input type="file" id="dirInput" webkitdirectory directory multiple hidden>

  <audio id="audio" preload="metadata" playsinline></audio>

  <script src="id3.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
